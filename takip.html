<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş Takibi | Moderra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .header { margin-bottom: 50px; }
        .header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .header p { color: var(--text-muted); }

        .search-box {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 15px 20px;
            font-size: 16px;
            outline: none;
            color: var(--text);
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover { transform: scale(1.05); }

        /* Tracking Result Overlay */
        #result-container {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            text-align: left;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .order-id { font-size: 20px; font-weight: 800; color: var(--primary); }

        /* Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 40px 0;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 25px; left: 0; right: 0;
            height: 4px;
            background: var(--border);
            z-index: 1;
        }

        .step-progress {
            position: absolute;
            top: 25px; left: 0;
            height: 4px;
            background: var(--primary);
            z-index: 2;
            transition: width 1s ease;
            width: 0%;
        }

        .step {
            position: relative;
            z-index: 3;
            text-align: center;
            flex: 1;
        }

        .step-icon {
            width: 54px;
            height: 54px;
            background: var(--card-bg);
            border: 4px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            transition: 0.3s;
            color: var(--text-muted);
        }

        .step.active .step-icon {
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .step.completed .step-icon {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .step-label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .step.active .step-label { color: var(--text); }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .detail-item {
            padding: 15px;
            background: var(--bg);
            border-radius: 15px;
        }

        .detail-item span { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
        .detail-item p { font-weight: 700; }

        .empty-state { padding: 40px; color: var(--text-muted); }
        
        /* Navbar matching */
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Ana Sayfa</a>

    <div class="container">
        <div class="header">
            <h1>Siparişini Takip Et</h1>
            <p>Sipariş numaranı girerek güncel durumu öğrenebilirsin.</p>
        </div>

        <div class="search-box">
            <input type="text" id="order-id-input" placeholder="Örn: MOD-12345">
            <button onclick="trackOrder()">Sorgula</button>
        </div>

        <div id="result-container">
            <div class="order-info-header">
                <div>
                    <span class="order-id" id="display-order-id">#MOD-12345</span>
                    <p id="display-date">22 Ocak 2026'da güncellendi</p>
                </div>
                <div id="status-text" style="font-weight: 800; text-transform: uppercase; color: var(--primary);">HAZIRLANIYOR</div>
            </div>

            <div class="stepper">
                <div class="step-progress" id="progress-bar"></div>
                
                <div class="step" id="step-1">
                    <div class="step-icon"><i class="fas fa-clipboard-list"></i></div>
                    <div class="step-label">Alındı</div>
                </div>
                <div class="step" id="step-2">
                    <div class="step-icon"><i class="fas fa-box-open"></i></div>
                    <div class="step-label">Hazırlanıyor</div>
                </div>
                <div class="step" id="step-3">
                    <div class="step-icon"><i class="fas fa-truck"></i></div>
                    <div class="step-label">Kargoda</div>
                </div>
                <div class="step" id="step-4">
                    <div class="step-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="step-label">Teslim Edildi</div>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <span>Müşteri</span>
                    <p id="display-customer">-</p>
                </div>
                <div class="detail-item">
                    <span>Tahmini Teslimat</span>
                    <p id="display-delivery">-</p>
                </div>
                <div class="detail-item" style="grid-column: span 2;">
                    <span>İçerik</span>
                    <p id="display-items">-</p>
                </div>
            </div>
        </div>

        <div id="not-found" class="empty-state" style="display: none;">
            <i class="fas fa-search fa-3x" style="margin-bottom: 20px; opacity: 0.3;"></i>
            <p>Sipariş bulunamadı. Lütfen numarayı kontrol edip tekrar deneyin.</p>
        </div>
    </div>

    <script>
        async function trackOrder() {
            const id = document.getElementById('order-id-input').value.trim().toUpperCase();
            if (!id) return;

            // Reset UI
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('not-found').style.display = 'none';

            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                const order = orders.find(o => o.orderId.toUpperCase() === id);

                if (order) {
                    showOrder(order);
                } else {
                    document.getElementById('not-found').style.display = 'block';
                }
            } catch (e) {
                console.error("Tracking error", e);
            }
        }

        function showOrder(order) {
            const container = document.getElementById('result-container');
            container.style.display = 'block';

            // Requested dynamic heading
            document.getElementById('display-order-id').innerHTML = `
                <span style="color:var(--text-muted); font-size:14px; display:block; margin-bottom:5px;">Sipariş Bilgileri</span>
                ${order.orderId} nolu ${order.customerName} kullanıcısının siparişi hakkında:
            `;
            document.getElementById('display-customer').textContent = order.customerName;
            document.getElementById('display-delivery').textContent = order.estimatedDelivery;
            document.getElementById('display-items').textContent = order.items;
            document.getElementById('status-text').textContent = order.status.toUpperCase();

            // Progress Logic
            const steps = {
                'alindi': 1,
                'hazirlaniyor': 2,
                'kargoda': 3,
                'teslim': 4
            };
            const currentStep = steps[order.status] || 1;

            // Update steps classes
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById('step-' + i);
                el.classList.remove('active', 'completed');
                if (i < currentStep) el.classList.add('completed');
                if (i === currentStep) el.classList.add('active');
            }

            // Update progress bar
            const progress = ((currentStep - 1) / 3) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        // Theme sync with parent if needed
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
