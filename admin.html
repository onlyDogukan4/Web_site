<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderra | Yönetici Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); transition: 0.3s; min-height: 100vh; display: flex; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid var(--border); padding: 30px; position: fixed; inset-y: 0; display: flex; flex-direction: column; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-menu { list-style: none; flex: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--radius); color: var(--text-muted); text-decoration: none; font-weight: 600; transition: 0.3s; margin-bottom: 8px; cursor: pointer; }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* Content Area */
        .main-content { margin-left: 280px; flex: 1; padding: 40px; }
        .section-card { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 30px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* Forms & Inputs */
        .editable-input { background: var(--bg); border: 2px solid var(--border); padding: 12px 16px; border-radius: 12px; color: var(--text-main); width: 100%; outline: none; transition: 0.2s; }
        .editable-input:focus { border-color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Buttons */
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }

        /* Tables */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--text-muted); border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); }

        /* Drag & Drop */
        .drop-zone { width: 100%; height: 200px; background: var(--bg); border: 3px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        .drop-zone.hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .drop-zone img { height: 100%; object-fit: contain; }
        .drop-zone.has-image .drop-text { display: none; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-card { background: var(--card-bg); border-radius: 28px; width: 100%; max-width: 700px; padding: 40px; box-shadow: var(--shadow); }

        /* Badge */
        .badge { padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .badge-hazirlaniyor { background: #fef3c7; color: #92400e; }
        .badge-kargoda { background: #dcfce7; color: #166534; }
        .badge-teslim { background: #e0e7ff; color: #3730a3; }

        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--success); color: white; padding: 15px 30px; border-radius: 12px; transform: translateY(100px); transition: 0.5s; z-index: 10001; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="section-card" style="width: 400px; text-align: center;">
            <div class="logo" style="justify-content: center;"><i class="fas fa-shield-halved"></i> Moderra Admin</div>
            <input type="password" id="admin-pass" class="editable-input" placeholder="Şifre" style="text-align: center; margin-bottom: 20px;">
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="checkLogin()">Giriş Yap</button>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-card">
            <h2 id="modal-title" style="margin-bottom: 25px;">Ürün Düzenle</h2>
            <div class="form-group">
                <label>Görsel (Sürükle-Bırak)</label>
                <div class="drop-zone" id="drop-zone">
                    <div class="drop-text"><i class="fas fa-cloud-upload-alt fa-3x"></i><br>Bırak veya Seç</div>
                    <img id="p-preview" src="" style="display:none">
                </div>
                <input type="file" id="p-file" accept="image/*" style="display:none">
            </div>
            <div class="form-row">
                <div class="form-group"><label>Başlık (TR)</label><input type="text" id="p-name-tr" class="editable-input"></div>
                <div class="form-group"><label>Title (EN)</label><input type="text" id="p-name-en" class="editable-input"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Fiyat (₺)</label><input type="number" id="p-price" class="editable-input"></div>
                <div class="form-group"><label>Puan</label><input type="text" id="p-rating" class="editable-input" value="5.0"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn btn-secondary" onclick="closeModal('product-modal')">İptal</button>
                <button class="btn btn-primary" onclick="saveProduct()">Ürünü Kaydet</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="order-modal">
        <div class="modal-card" style="max-width: 500px;">
            <h2 style="margin-bottom: 25px;">Yeni Sipariş Oluştur</h2>
            <div class="form-group"><label>Müşteri Adı</label><input type="text" id="o-customer" class="editable-input"></div>
            <div class="form-group"><label>Sipariş Detayı</label><textarea id="o-items" class="editable-input" rows="3"></textarea></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Durum</label>
                    <select id="o-status" class="editable-input">
                        <option value="hazirlaniyor">Hazırlanıyor</option>
                        <option value="kargoda">Kargoda</option>
                        <option value="teslim">Teslim Edildi</option>
                    </select>
                </div>
                <div class="form-group"><label>Söz Edilen Teslimat</label><input type="date" id="o-delivery" class="editable-input"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn btn-secondary" onclick="closeModal('order-modal')">İptal</button>
                <button class="btn btn-primary" onclick="createManualOrder()">Onayla ve Kod Oluştur</button>
            </div>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo"><i class="fas fa-cube"></i> MODERRA</div>
        <ul class="nav-menu">
            <li class="nav-link active" id="nav-p" onclick="showTab('p')"><i class="fas fa-boxes-stacked"></i> Ürünler</li>
            <li class="nav-link" id="nav-o" onclick="showTab('o')"><i class="fas fa-receipt"></i> Siparişler</li>
            <li class="nav-link" onclick="window.open('index.html')"><i class="fas fa-eye"></i> Siteyi Gör</li>
        </ul>
        <button class="btn btn-danger" style="margin-top: 50px; width: 100%;" onclick="logout()">Çıkış Yap</button>
    </aside>

    <main class="main-content">
        <!-- Ürünler Sekmesi -->
        <section id="p-section">
            <div class="section-header">
                <h1>Ürün Yönetimi</h1>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Yeni Ürün</button>
            </div>
            <div class="section-card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Görsel</th><th>İsim</th><th>Fiyat</th><th>İşlem</th></tr></thead>
                        <tbody id="p-tbody"></tbody>
                    </table>
                </div>
                <div style="margin-top: 30px; text-align: right;">
                    <button class="btn btn-primary" style="padding: 15px 40px;" onclick="syncAll()">Tümünü Veritabanına Yaz</button>
                </div>
            </div>
        </section>

        <!-- Siparişler Sekmesi -->
        <section id="o-section" style="display:none;">
            <div class="section-header">
                <h1>Sipariş Yönetimi</h1>
                <button class="btn btn-primary" onclick="document.getElementById('order-modal').style.display='flex'"><i class="fas fa-plus"></i> Manuel Sipariş Oluştur</button>
            </div>
            <div class="section-card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Kod</th><th>Müşteri</th><th>Ürünler</th><th>Durum</th><th>#</th></tr></thead>
                        <tbody id="o-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast">Canlıya aktarıldı!</div>

    <script>
        const PASS = "123456";
        let products = [];
        let orders = [];
        let curIdx = -1;
        let pImg = "";

        function checkLogin() { if(document.getElementById('admin-pass').value===PASS) { sessionStorage.setItem('auth','1'); document.getElementById('login-overlay').style.display='none'; init(); } }
        function logout() { sessionStorage.clear(); location.reload(); }
        if(sessionStorage.getItem('auth')) { document.getElementById('login-overlay').style.display='none'; init(); }

        async function init() {
            try {
                const [p, o] = await Promise.all([
                    fetch('/api/products?t='+Date.now()).then(r=>r.json()),
                    fetch('/api/orders?t='+Date.now()).then(r=>r.json())
                ]);
                products = Array.isArray(p) ? p : [];
                orders = Array.isArray(o) ? o : [];
                renderP(); renderO();
            } catch(e) { console.error(e); }
        }

        function showTab(t) {
            document.getElementById('p-section').style.display = t==='p'?'block':'none';
            document.getElementById('o-section').style.display = t==='o'?'block':'none';
            document.getElementById('nav-p').classList.toggle('active', t==='p');
            document.getElementById('nav-o').classList.toggle('active', t==='o');
        }

        function renderP() {
            const b = document.getElementById('p-tbody'); b.innerHTML='';
            products.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${p.image}" style="width:50px; border-radius:8px;"></td>
                    <td><b>${p.name_tr}</b></td>
                    <td>₺${parseFloat(p.price).toLocaleString()}</td>
                    <td>
                        <button class="btn" style="background:#f1f5f9" onclick="openEdit(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" onclick="delP(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                b.appendChild(tr);
            });
        }

        function renderO() {
            const b = document.getElementById('o-tbody'); b.innerHTML='';
            orders.sort((a,b)=>new Date(b.lastUpdate)-new Date(a.lastUpdate)).forEach((o, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:var(--primary)">#${o.orderId}</strong></td>
                    <td>${o.customerName}</td>
                    <td>${o.items}</td>
                    <td><span class="badge badge-${o.status}">${o.status}</span></td>
                    <td><button class="btn btn-danger" onclick="delO('${o.orderId}')"><i class="fas fa-trash"></i></button></td>
                `;
                b.appendChild(tr);
            });
        }

        function openAddModal() { curIdx=-1; pImg=""; resetModal(); document.getElementById('product-modal').style.display='flex'; }
        function openEdit(i) {
            curIdx=i; const p=products[i];
            document.getElementById('p-name-tr').value=p.name_tr;
            document.getElementById('p-name-en').value=p.name_en||"";
            document.getElementById('p-price').value=p.price;
            pImg = p.image;
            if(pImg) { document.getElementById('p-preview').src=pImg; document.getElementById('p-preview').style.display='block'; document.getElementById('drop-zone').classList.add('has-image'); }
            document.getElementById('product-modal').style.display='flex';
        }

        function saveProduct() {
            const p = {
                id: curIdx>-1?products[curIdx].id:Date.now().toString(),
                name_tr: document.getElementById('p-name-tr').value,
                name_en: document.getElementById('p-name-en').value,
                price: parseFloat(document.getElementById('p-price').value),
                image: pImg || "images/bardak.png",
                rating: document.getElementById('p-rating').value
            };
            if(!p.name_tr || isNaN(p.price)) return alert("Hata!");
            if(curIdx>-1) products[curIdx]=p; else products.push(p);
            renderP(); closeModal('product-modal');
        }

        function delP(i) { if(confirm("Sil?")) { products.splice(i,1); renderP(); } }

        function createManualOrder() {
            const name = document.getElementById('o-customer').value;
            const items = document.getElementById('o-items').value;
            if(!name || !items) return alert("Hata!");
            const code = "MOD-" + Math.floor(10000 + Math.random()*90000);
            orders.push({ orderId: code, customerName: name, items, status: document.getElementById('o-status').value, lastUpdate: new Date().toISOString() });
            renderO(); closeModal('order-modal'); syncAll();
            alert("Yeni Sipariş Kodu: " + code);
        }

        function delO(id) { if(confirm("Sil?")) { orders=orders.filter(x=>x.orderId!==id); renderO(); syncAll(); } }

        async function syncAll() {
            try {
                await Promise.all([
                    fetch('/api/products', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(products) }),
                    fetch('/api/orders', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(orders) }),
                    fetch('/api/last-update', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({time: new Date().toLocaleString('tr-TR')}) })
                ]);
                const t = document.getElementById('toast'); t.classList.add('show');
                setTimeout(()=>t.classList.remove('show'), 3000);
            } catch(e) { alert("Bağlantı Hatası!"); }
        }

        function resetModal() {
            document.getElementById('p-name-tr').value=''; document.getElementById('p-name-en').value='';
            document.getElementById('p-price').value=''; document.getElementById('p-preview').style.display='none';
            document.getElementById('drop-zone').classList.remove('has-image');
        }

        function closeModal(id) { document.getElementById(id).style.display='none'; }

        // Drag Drop Logic
        const dz = document.getElementById('drop-zone'); const fi = document.getElementById('p-file');
        dz.onclick=()=>fi.click();
        dz.ondragover=(e)=>{ e.preventDefault(); dz.classList.add('hover'); };
        dz.ondragleave=()=>dz.classList.remove('hover');
        dz.ondrop=(e)=>{
            e.preventDefault(); dz.classList.remove('hover');
            const file = e.dataTransfer.files[0];
            if(file) {
                const r = new FileReader();
                r.onload=(ev)=>{ pImg=ev.target.result; document.getElementById('p-preview').src=pImg; document.getElementById('p-preview').style.display='block'; dz.classList.add('has-image'); };
                r.readAsDataURL(file);
            }
        };
        fi.onchange=(e)=>{
            const file = fi.files[0];
            if(file) {
                const r = new FileReader();
                r.onload=(ev)=>{ pImg=ev.target.result; document.getElementById('p-preview').src=pImg; document.getElementById('p-preview').style.display='block'; dz.classList.add('has-image'); };
                r.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
