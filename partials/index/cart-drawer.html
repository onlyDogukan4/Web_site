<!-- Sepet Drawer -->
    <div id="cart-modal" class="cart-drawer">
        <div class="cart-header">
            <h2 style="margin:0;font-size:22px;font-weight:900;color:#1e293b;">
                <i class="fas fa-shopping-basket" style="color:var(--primary);margin-right:10px;"></i> Sepetim
            </h2>
            <span style="cursor:pointer;font-size:28px;color:#cbd5e1;" onclick="document.body.classList.remove('cart-open')">&times;</span>
        </div>
        <div id="cart-progress-sticky"></div>
        <div id="cart-items-list" style="padding:20px;overflow-y:auto;flex:1;"></div>
        <div style="padding:20px 25px 25px;background:white;border-top:1px solid #f1f5f9;">
            <div id="cart-total-price-area"></div>
            <button id="whatsapp-checkout" onclick="whatsappCheckout()"
                    style="width:100%;margin-top:15px;padding:20px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;cursor:pointer;color:white;font-size:16px;font-weight:800;">
                <i class="fab fa-whatsapp" style="font-size:22px;"></i> SİPARİŞİ TAMAMLA
            </button>
        </div>
    </div>
    <div class="cart-overlay" onclick="document.body.classList.remove('cart-open')"></div>
