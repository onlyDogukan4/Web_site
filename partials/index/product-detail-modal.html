<!-- Ürün Detay Modalı -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-content" style="max-width:1000px;border-radius:40px!important;">
            <span class="close-btn detail-close" style="z-index:10;font-size:40px;right:30px;top:20px;">&times;</span>
            <div class="product-detail-container">
                <div class="product-detail-image">
                    <img id="detail-img" src="" alt="Ürün Detayı">
                </div>
                <div class="product-detail-info">
                    <div id="detail-rating" style="color:#f59e0b;font-size:18px;margin-bottom:20px;"></div>
                    <h2 id="detail-title">Ürün Adı</h2>
                    <div id="detail-price" style="font-size:28px;font-weight:900;color:var(--primary);margin:15px 0;">₺0,00</div>
                    <p id="detail-desc" style="color:var(--text-muted);line-height:1.7;margin-bottom:25px;"></p>
                    <button id="detail-add-btn" class="btn-primary">
                        <i class="fas fa-shopping-cart" style="margin-right:12px;"></i> SEPETE EKLE
                    </button>
                    <div style="margin-top:30px;display:flex;gap:20px;border-top:1px solid var(--border);padding-top:25px;">
                        <div style="text-align:center;flex:1;">
                            <i class="fas fa-certificate" style="color:var(--primary);font-size:24px;margin-bottom:10px;"></i>
                            <p style="font-size:11px;font-weight:700;color:var(--text-muted);">%100 HİJYENİK</p>
                        </div>
                        <div style="text-align:center;flex:1;">
                            <i class="fas fa-leaf" style="color:#10b981;font-size:24px;margin-bottom:10px;"></i>
                            <p style="font-size:11px;font-weight:700;color:var(--text-muted);">GERİ DÖNÜŞÜMLÜ</p>
                        </div>
                        <div style="text-align:center;flex:1;">
                            <i class="fas fa-shipping-fast" style="color:#f59e0b;font-size:24px;margin-bottom:10px;"></i>
                            <p style="font-size:11px;font-weight:700;color:var(--text-muted);">HIZLI TESLİMAT</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
