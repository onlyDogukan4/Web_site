<!-- Arama (sticky bar) -->
    <div class="search-bar-sticky" id="search-bar">
        <div class="search-bar-inner">
            <i class="fas fa-search search-bar-icon"></i>
            <input type="text" id="search-input" class="search-bar-input"
                   placeholder="Ürün ara..."
                   data-tr-placeholder="Ürün ara..."
                   data-en-placeholder="Search products...">
            <span class="search-bar-count" id="search-count"></span>
            <button class="search-bar-close" id="close-search" title="Kapat">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
