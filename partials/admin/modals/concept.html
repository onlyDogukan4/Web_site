<!-- CONCEPT MODAL -->
    <div class="modal-overlay" id="concept-modal">
        <div class="modal-card" style="max-width: 700px;">
            <h2 id="con-modal-title">Konsept Düzenle</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Konsept Adı (TR)</label>
                    <input type="text" id="con-name" class="editable-input" placeholder="Örn: Yılbaşı">
                </div>
                <div class="form-group">
                    <label>Concept Name (EN)</label>
                    <input type="text" id="con-name-en" class="editable-input" placeholder="E.g. New Year">
                </div>
            </div>
            <div class="form-row">
                 <div class="form-group">
                    <label>Tema Rengi</label>
                    <input type="color" id="con-color" class="editable-input" value="#e74c3c">
                </div>
                <div class="form-group">
                    <label>Arkaplan Rengi</label>
                    <input type="color" id="con-bg" class="editable-input" value="#ffffff">
                </div>
                 <div class="form-group" style="display:flex; align-items:center; gap:10px; margin-top:25px;">
                    <input type="checkbox" id="con-published" style="width:20px; height:20px;">
                    <label style="margin:0;">Sitede Yayınla</label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Etiket Yazısı (Modern Label)</label>
                    <input type="text" id="con-label" class="editable-input" placeholder="Örn: %20 İndirim veya FIRSAT">
                </div>
                <div class="form-group">
                    <label>Varsayılan Fiyat (₺) <span style="font-size:11px;color:#94a3b8;">— varyasyonlara fiyat girilmezse bu tutar kullanılır.</span></label>
                    <input type="number" id="con-price" class="editable-input" min="0" step="0.01" placeholder="Örn: 15.50">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Açıklama (TR)</label><textarea id="con-desc-tr" class="editable-input" rows="2" placeholder="Konsept hakkında bilgi..."></textarea></div>
                <div class="form-group"><label>Description (EN)</label><textarea id="con-desc-en" class="editable-input" rows="2" placeholder="Concept details in English..."></textarea></div>
            </div>
            <div class="form-group">
                <label>Baz Görsel (Sürükle-Bırak)</label>
                <div class="drop-zone" id="con-drop-zone">
                    <div id="con-drop-text" style="text-align: center; color: var(--text-muted);">
                        <i class="fas fa-cloud-upload-alt fa-2x"></i><br>
                        <span style="font-size: 11px;">Baz bardağı buraya bırakın</span>
                    </div>
                    <img id="con-preview" src="" style="display:none; height:100px;">
                </div>
                <input type="file" id="con-file" accept="image/*" style="display:none">
            </div>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
            <h4>Oz/Kapak Varyasyon Görselleri</h4>
            <div id="con-variations" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; max-height: 300px; overflow-y: auto; padding: 10px; background: #f8fafc; border-radius: 12px;">
                <!-- JS dynamic render -->
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn btn-secondary" onclick="closeModal('concept-modal')">İptal</button>
                <button class="btn btn-primary" onclick="handleConceptSave()">Kaydet</button>
            </div>
            <span class="close-btn" onclick="closeModal('concept-modal')">&times;</span>
        </div>
    </div>
