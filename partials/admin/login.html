<div id="login-overlay">
        <div class="section-card" style="width: 380px; text-align: center; border: 1px solid var(--border);">
            <div class="logo">Moderra Yönetim</div>
            <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 14px;">Panele erişmek için şifrenizi girin.</p>
            <input type="password" id="admin-pass" class="editable-input" placeholder="Şifre" style="text-align: center; margin-bottom: 15px;" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkLogin()">
            <button type="button" class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="checkLogin()">Giriş Yap</button>
        </div>
    </div>
