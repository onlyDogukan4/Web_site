<!-- Genel Ayarlar Bölümü -->
        <section id="sec-s" style="display:none">
            <div class="section-header">
                <div>
                    <h1>Genel Ayarlar</h1>
                    <p style="color: var(--text-muted); font-size: 14px;">Mağazanızın genel ayarlarını buradan yönetin.</p>
                </div>
            </div>
            <div class="section-card">
                <div class="form-row">
                    <div class="form-group">
                        <label>Minimum Sipariş Tutarı (₺)</label>
                        <input type="number" id="s-min-order" class="editable-input" placeholder="Örn: 500">
                    </div>
                    <div class="form-group">
                        <label>Ücretsiz Kargo Limiti (₺)</label>
                        <input type="number" id="s-free-shipping" class="editable-input" placeholder="Örn: 1000">
                    </div>
                </div>
                <!-- Not: s-min-order inputu aşağıda JS ile doldurulacak -->
                <div style="text-align:right; margin-top:25px; border-top: 1px solid var(--border); padding-top: 20px;">
                    <button class="btn btn-primary" style="padding:15px 40px" onclick="saveSettings()">
                        <i class="fas fa-save"></i> AYARLARI KAYDET
                    </button>
                </div>
            </div>

            <!-- ── Manuel Ödeme Linki ──────────────────────────────── -->
            <div class="section-card" style="margin-top:30px;">
                <h3 style="margin:0 0 6px;font-size:17px;font-weight:900;color:var(--primary);display:flex;align-items:center;gap:8px;">
                    <i class="fas fa-link"></i> Manuel Ödeme Linki
                </h3>
                <p style="margin:0 0 20px;font-size:13px;color:#64748b;">Müşteriye özel bir tutar girin, oluşan linki WhatsApp / e-posta ile gönderin.</p>

                <div class="form-row">
                    <div class="form-group">
                        <label>Müşteri Adı Soyadı</label>
                        <input type="text" id="pl-name" class="editable-input" placeholder="Ahmet Yılmaz">
                    </div>
                    <div class="form-group">
                        <label>Telefon (opsiyonel)</label>
                        <input type="text" id="pl-phone" class="editable-input" placeholder="05XX XXX XX XX">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Açıklama / Ürün Adı</label>
                        <input type="text" id="pl-desc" class="editable-input" placeholder="Özel tasarım bardak siparişi">
                    </div>
                    <div class="form-group">
                        <label>Tutar (₺)</label>
                        <input type="number" id="pl-amount" class="editable-input" placeholder="1500" min="1" step="0.01">
                    </div>
                </div>

                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;">
                    <button class="btn btn-primary" style="padding:14px 32px" onclick="createPaymentLink()">
                        <i class="fas fa-link"></i> LİNK OLUŞTUR
                    </button>
                    <div id="pl-result" style="display:none;flex:1;min-width:260px;">
                        <div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;">
                            <i class="fas fa-check-circle" style="color:#22c55e;font-size:18px;flex-shrink:0;"></i>
                            <div style="flex:1;min-width:0;">
                                <div style="font-size:10px;font-weight:800;color:#16a34a;text-transform:uppercase;margin-bottom:3px;">Link Hazır — Kopyala ve Gönder</div>
                                <input id="pl-link-input" type="text" readonly style="width:100%;font-size:12px;border:none;background:transparent;color:#1e293b;font-weight:700;outline:none;cursor:pointer;" onclick="this.select()">
                            </div>
                            <button onclick="copyPaymentLink()" style="background:#22c55e;border:none;border-radius:8px;padding:6px 12px;color:white;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;">
                                <i class="far fa-copy"></i> Kopyala
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Mevcut linkler tablosu -->
                <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:20px;">
                    <h4 style="margin:0 0 14px;font-size:14px;font-weight:800;color:#334155;">Gönderilen Linkler</h4>
                    <div style="overflow-x:auto;">
                        <table style="width:100%;border-collapse:collapse;font-size:13px;">
                            <thead>
                                <tr style="background:#f8fafc;text-align:left;">
                                    <th style="padding:10px 12px;font-weight:800;color:#64748b;font-size:11px;text-transform:uppercase;">Müşteri</th>
                                    <th style="padding:10px 12px;font-weight:800;color:#64748b;font-size:11px;text-transform:uppercase;">Açıklama</th>
                                    <th style="padding:10px 12px;font-weight:800;color:#64748b;font-size:11px;text-transform:uppercase;">Tutar</th>
                                    <th style="padding:10px 12px;font-weight:800;color:#64748b;font-size:11px;text-transform:uppercase;">Durum</th>
                                    <th style="padding:10px 12px;font-weight:800;color:#64748b;font-size:11px;text-transform:uppercase;">İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="pl-table-body">
                                <tr><td colspan="5" style="padding:20px;text-align:center;color:#94a3b8;">Yükleniyor...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
