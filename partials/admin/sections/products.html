<!-- Ürünler Bölümü -->
        <section id="sec-p">
            <div class="section-header">
                <div>
                    <h1>Mevcut Ürünler</h1>
                    <p style="color: var(--text-muted); font-size: 14px;">Mağazanızda yayında olan tüm ürünler.</p>
                </div>
            </div>
            
            <!-- Filter Bar -->
            <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; border: 1px solid var(--border);">
                <input type="text" id="search-box" class="editable-input" placeholder="Ürün Ara..." onkeyup="renderAll()" style="flex: 2;">
                <select id="filter-cat" class="editable-input" onchange="renderAll()" style="flex: 1; display:none;"> <!-- Hidden for now as categories aren't implemented fully -->
                    <option value="">Tüm Kategoriler</option>
                </select>
                <select id="filter-status" class="editable-input" onchange="renderAll()" style="flex: 1;">
                    <option value="">Tüm Durumlar</option>
                    <option value="active">Aktif</option>
                    <option value="oos">Stok Yok</option>
                    <option value="hot">Kampanya</option>
                </select>
                <button class="btn btn-primary" onclick="openAddProduct()" style="white-space: nowrap;"><i class="fas fa-plus"></i> Yeni Ürün</button>
            </div>

            <div class="section-card">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">Görsel</th>
                                <th style="width: 60px;">ID</th>
                                <th>Ürün Adı</th>
                                <th>Birim Fiyat</th>
                                <th>Kampanya</th>
                                <th>Durum</th>
                                <th style="text-align: right;">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="p-table">
                            <!-- JS ile dolacak -->
                            <tr><td colspan="5" style="text-align:center; padding: 40px;">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="text-align:right; margin-top:25px; border-top: 1px solid var(--border); padding-top: 20px;">
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">* Yapılan tüm değişiklikleri canlıya yansıtmak için basın.</p>
                    <button class="btn btn-primary" style="padding:15px 40px" onclick="syncData('all')">
                        <i class="fas fa-cloud-upload-alt"></i> TÜMÜNÜ KAYDET VE YAYINLA
                    </button>
                </div>
            </div>
        </section>
