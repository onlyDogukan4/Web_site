<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ödeme Başarısız — Moderra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1f0a0a 40%, #0f172a 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; color: #fff;
            overflow-x: hidden; padding: 20px;
        }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(239,68,68,0.3), transparent);
            animation: float-particle linear infinite;
        }
        @keyframes float-particle {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        .card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 520px; width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(239,68,68,0.2);
            animation: card-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes card-in {
            from { opacity: 0; transform: scale(0.85) translateY(40px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .x-ring {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            animation: shake-ring 0.6s ease 0.4s;
        }
        @keyframes shake-ring {
            0%,100% { transform: rotate(0); }
            20%     { transform: rotate(-8deg); }
            40%     { transform: rotate(8deg); }
            60%     { transform: rotate(-5deg); }
            80%     { transform: rotate(5deg); }
        }
        .x-ring i { font-size: 44px; color: white; }

        h1 { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.55); font-size: 15px; margin-bottom: 28px; }

        /* Hata sebebi kutusu */
        .error-box {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 14px; padding: 16px 20px;
            margin-bottom: 24px; display: none;
        }
        .error-box label {
            font-size: 11px; font-weight: 800; letter-spacing: 2px;
            color: rgba(239,68,68,0.7); text-transform: uppercase;
            display: block; margin-bottom: 6px;
        }
        .error-box .msg { font-size: 14px; color: rgba(255,255,255,0.7); }

        .info-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 20px;
            margin-bottom: 24px;
        }
        .info-box ul { list-style: none; text-align: left; }
        .info-box ul li {
            padding: 8px 0; font-size: 14px; color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: flex-start; gap: 10px;
        }
        .info-box ul li:last-child { border-bottom: none; }
        .info-box ul li i { color: #fbbf24; margin-top: 2px; flex-shrink: 0; }

        .btn-retry {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; text-decoration: none;
            padding: 14px 32px; border-radius: 14px;
            font-weight: 800; font-size: 15px;
            transition: all 0.3s; border: none; cursor: pointer;
            width: 100%; justify-content: center; margin-bottom: 12px;
        }
        .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.4); }

        .btn-whatsapp {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(37,211,102,0.12);
            border: 1px solid rgba(37,211,102,0.3);
            color: #4ade80; text-decoration: none;
            padding: 12px 24px; border-radius: 14px;
            font-weight: 700; font-size: 14px;
            transition: all 0.3s; cursor: pointer;
            width: 100%; justify-content: center;
        }
        .btn-whatsapp:hover { background: rgba(37,211,102,0.2); }

        .logo-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: rgba(255,255,255,0.3); text-decoration: none;
            font-size: 13px; font-weight: 700; margin-bottom: 28px;
        }
        .logo-link:hover { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<div class="card">
    <a href="index.html" class="logo-link">
        <i class="fas fa-cube"></i> Moderra
    </a>

    <div class="x-ring">
        <i class="fas fa-times"></i>
    </div>

    <h1>Ödeme Başarısız</h1>
    <p class="subtitle">İşleminiz tamamlanamadı. Endişelenmeyin, ücret alınmadı.</p>

    <!-- Hata mesajı varsa göster -->
    <div class="error-box" id="error-box">
        <label><i class="fas fa-exclamation-triangle"></i> Hata Sebebi</label>
        <div class="msg" id="fail-reason">—</div>
    </div>

    <!-- Olası sebepler -->
    <div class="info-box">
        <ul>
            <li><i class="fas fa-exclamation-circle"></i> Kart bilgileri hatalı girilmiş olabilir</li>
            <li><i class="fas fa-ban"></i> Kartınızda yeterli limit olmayabilir</li>
            <li><i class="fas fa-lock"></i> Bankanız işlemi güvenlik nedeniyle reddetti</li>
            <li><i class="fas fa-clock"></i> İşlem zaman aşımına uğradı</li>
        </ul>
    </div>

    <button class="btn-retry" onclick="goBack()">
        <i class="fas fa-redo"></i> Tekrar Dene
    </button>

    <button class="btn-whatsapp" onclick="contactWhatsApp()">
        <i class="fab fa-whatsapp"></i> WhatsApp ile Sipariş Ver
    </button>
</div>

<script>
    // İFrame içindeyse üst sayfayı bu URL'e yönlendir
    if (window !== window.top) {
        window.top.location.href = window.location.href;
    }

    const params = new URLSearchParams(window.location.search);
    const failReason = params.get('failed_reason_msg') || params.get('reason') || '';
    const orderId = params.get('merchant_oid') || '';

    if (failReason) {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('fail-reason').textContent = failReason;
    }

    function goBack() {
        // Sepeti koruyarak ana sayfaya dön
        window.location.href = 'index.html';
    }

    function contactWhatsApp() {
        window.open('https://wa.me/905304640120?text=' +
            encodeURIComponent('Merhaba, ' + (orderId ? orderId + ' numaralı siparişim için ' : '') + 'ödeme işleminde sorun yaşadım. Yardımcı olur musunuz?'),
            '_blank');
    }

    // Partiküller
    const container = document.getElementById('particles');
    for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 60 + 20;
        p.style.cssText = `
            width:${size}px; height:${size}px;
            left:${Math.random()*100}%;
            animation-duration:${Math.random()*10+8}s;
            animation-delay:-${Math.random()*12}s;
        `;
        container.appendChild(p);
    }
</script>
    <script src="js/mobile.js" defer></script>
</body>
</html>
