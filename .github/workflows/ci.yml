name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    unit-and-integration:
        name: Unit & Integration Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run unit & integration tests
              run: npm run test
              env:
                  PAYTR_MOCK: 'true'
                  PAYTR_TEST_MODE: '1'

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: unit-and-integration
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install chromium --with-deps

            - name: Run E2E tests
              run: npm run test:e2e
              env:
                  CI: true
                  PAYTR_MOCK: 'true'
                  USE_MEMORY_DB: 'true'

    # İsteğe bağlı: Vercel preview deploy sonrası staging E2E
    # PAYTR gerçek test modu için GitHub Secrets gerekir:
    # PAYTR_MERCHANT_ID, PAYTR_MERCHANT_KEY, PAYTR_MERCHANT_SALT, MONGODB_URI
