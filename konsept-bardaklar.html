<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
    <style>
        :root {
            --theme-color: #6366f1;
            --theme-bg: #fff;
            --theme-text: #1e293b;
            --danger: #ef4444;
            --success: #10b981;
            --primary: #6366f1;
        }

        /* Modernized Search Bar from Index */
        .search-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .search-container.active { opacity: 1; visibility: visible; }
        .search-wrapper {
            width: 100%; max-width: 800px; padding: 0 40px; position: relative;
            transform: scale(0.9); transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .search-container.active .search-wrapper { transform: scale(1); }
        .search-wrapper input {
            width: 100%; background: white; border: 1px solid rgba(0,0,0,0.05);
            color: #1e293b; font-size: 32px; font-weight: 800; padding: 30px 40px; border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); outline: none; transition: 0.4s;
            letter-spacing: -0.5px;
        }
        .search-close { position: absolute; top: -80px; right: 40px; font-size: 40px; color: #1e293b; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .search-close:hover { opacity: 1; transform: rotate(90deg); }

        /* Re-designed Navbar Active Tab Effect (Neon Line) */
        .nav-links a {
            position: relative;
            padding: 10px 20px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }
        .nav-links a::before {
            content: '';
            position: absolute; bottom: 0; left: 50%; width: 0; height: 2px;
            background: var(--primary); transform: translateX(-50%);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--primary);
        }
        .nav-links a.active {
            color: var(--primary) !important;
        }
        .nav-links a.active::before {
            width: 80%;
        }

        @keyframes oos-shake {
            0%, 100% { transform: scale(1); }
            10%, 30%, 50%, 70%, 90% { transform: scale(0.95) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: scale(1.05) rotate(2deg); }
        }
        .oos-active { animation: oos-shake 0.5s ease-in-out; }

        body {
            transition: background-color 0.8s ease, color 0.8s ease;
            background-color: var(--theme-bg);
            overflow-x: hidden;
        }

        .navbar {
            background-color: var(--glass-bg) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .concept-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            position: relative;
            scroll-snap-align: start;
            color: var(--theme-text);
        }

        .concept-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .concept-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cup-preview {
            width: 350px;
            height: 450px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.5s ease;
            border: 1px solid var(--border-muted);
        }

        #design-overlay {
            position: absolute;
            top: 53.5%; 
            left: 53%; 
            transform: translate(-50%, -50%) perspective(1000px) rotateY(15deg) rotateZ(-1deg);
            width: 145px;
            height: 165px;
            pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            mask-image: radial-gradient(ellipse at center, black 70%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 70%, transparent 100%);
        }

        .cup-highlight {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.3) 35%, rgba(255,255,255,0.1) 45%, transparent 60%);
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
        }

        #user-design-preview {
            width: 80%;
            height: auto;
            max-height: 80%;
            object-fit: contain;
            filter: contrast(1.1) brightness(0.95) saturate(1.1);
        }

        .dynamic-cup {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .concept-details h1 {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--theme-color);
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .concept-details p {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.8;
            max-width: 500px;
        }

        .customize-group {
            margin-bottom: 30px;
        }

        .customize-label {
            display: block;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .option-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .size-btn, .lid-btn {
            padding: 10px 20px;
            border: 2px solid var(--theme-color);
            background: transparent;
            color: var(--theme-text);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .size-btn.active, .lid-btn.active {
            background: var(--theme-color);
            color: white;
        }

        .color-swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 0 0 1px #ddd;
            transition: 0.3s;
        }

        .color-swatch.active {
            box-shadow: 0 0 0 2px var(--theme-color);
            transform: scale(1.2);
        }

        .order-btn {
            margin-top: 20px;
            background: var(--theme-color);
            color: white;
            padding: 18px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .scroll-indicator {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: var(--theme-color);
            transform: scale(1.5);
        }

        @media (max-width: 968px) {
            .concept-container { grid-template-columns: 1fr; text-align: center; }
            .concept-visual { order: -1; }
            .concept-details p { margin: 0 auto 40px; }
            .option-list { justify-content: center; }
            .concept-details h1 { font-size: 40px; }
        }

        .modern-cup-label {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* Yeni Pagination ve Kategori Stilleri */
        .category-nav {
            background: var(--glass-bg);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 80px;
            z-index: 90;
            backdrop-filter: blur(10px);
        }

        .cat-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--theme-color);
            background: transparent;
            color: var(--theme-text);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-btn.active {
            background: var(--theme-color);
            color: white;
        }

        .pagination-container {
            padding: 40px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            background: var(--bg-body);
        }

        .page-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--theme-color);
            color: white;
            border-color: var(--theme-color);
        }

        .size-btn.oos {
            position: relative;
            opacity: 0.5;
            cursor: not-allowed;
            overflow: hidden;
        }
        .size-btn.oos::after {
            content: '';
            position: absolute;
            top: 50%; left: -10%;
            width: 120%; height: 2px;
            background: #ef4444;
            transform: rotate(-15deg);
        }

        .resource-report {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            z-index: 10000;
            pointer-events: none;
            border: 1px solid #333;
        }

        /* Confirmation Modal */
        #confirm-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            z-index: 20000;
            align-items: center; justify-content: center;
        }
        .confirm-content {
            background: white;
            width: 100%; max-width: 500px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .confirm-header {
            background: linear-gradient(45deg, #d4af37, #b45309);
            padding: 30px; color: white; text-align: center;
        }
        .confirm-body { padding: 40px; }
        .confirm-item { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 15px; border-bottom: 1px dashed #eee; padding-bottom: 15px; }
        .confirm-label { font-weight: 800; color: #64748b; }
        .confirm-value { font-weight: 900; color: #1e293b; text-align: right; }
        .confirm-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px 40px 40px; }
        .confirm-btn { padding: 18px; border-radius: 16px; font-weight: 800; cursor: pointer; border: none; transition: 0.3s; }
        .confirm-cancel { background: #f1f5f9; color: #64748b; }
        .confirm-approve { background: var(--theme-color); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .confirm-approve:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
    </style>
</head>

    <script>
        const root = document.documentElement;
        let concepts = [];
        let itemsPerPage = 2; // Bir sayfada kaç ürün görünecek
        let currentPage = 1;
        let currentCategory = 'Tümü';

        async function initConcepts() {
            try {
                const res = await fetch('/api/concepts?t=' + Date.now());
                const raw = await res.json();
                concepts = (raw || []).filter(c => c.published);
                
                renderConceptSections();
                startResourceMonitoring();
            } catch (e) { console.error(e); }
        }

        function renderConceptSections() {
            const wrapper = document.getElementById('concepts-wrapper');
            const filtered = concepts; // No more category filtering per request

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const currentItems = filtered.slice(start, end);

            wrapper.innerHTML = '';
            
            if (currentItems.length === 0) {
                wrapper.innerHTML = '<div style="text-align:center; padding:100px; font-size:24px; opacity:0.5;">Bu kategoride ürün bulunamadı.</div>';
            }

            currentItems.forEach((c, idx) => {
                const section = document.createElement('section');
                section.className = 'concept-section';
                section.id = c.id;
                section.dataset.color = c.theme_color;
                section.dataset.bg = c.bg_color;

                const isEn = localStorage.getItem('lang') === 'en';
                const name = isEn ? (c.name_en || c.name) : c.name;
                const desc = isEn ? (c.desc_en || c.desc_tr) : (c.desc_tr || 'Özel tasarım bardaklar.');

                const variants = c.variations || {};
                
                section.innerHTML = `
                    <div class="concept-container">
                        <div class="concept-visual">
                            <div class="cup-preview">
                                <img src="${c.base_image}" alt="${name}" class="dynamic-cup">
                                ${c.label_text ? `<div class="modern-cup-label" style="background:${c.theme_color}; color:white;">${c.label_text}</div>` : ''}
                            </div>
                        </div>
                        <div class="concept-details">
                            <h1 style="color:var(--theme-color)">${name}</h1>
                            <p>${desc}</p>
                            
                            <div class="customize-group">
                                <span class="customize-label" data-tr="BOYUT SEÇİMİ" data-en="SIZE SELECTION">Boyut Seçimi</span>
                                <div class="option-list" data-concept-id="${c.id}">
                                    ${['4oz', '7oz', '8oz', '12oz'].map(oz => {
                                        const isOOS = variants[`${oz}-nolid`]?.stock === 0;
                                        return `<button class="size-btn ${oz === '4oz' ? 'active' : ''} ${isOOS ? 'oos' : ''}" 
                                            data-oz="${oz}" onclick="selectSize(this)" ${isOOS ? 'disabled' : ''}>${oz.replace('oz', ' oz')}</button>`;
                                    }).join('')}
                                </div>
                            </div>

                            <div class="customize-group">
                                <span class="customize-label" data-tr="KAPAK SEÇENEĞİ" data-en="LID OPTION">Kapak Seçeneği</span>
                                <div class="option-list" data-concept-id="${c.id}">
                                    <button class="lid-btn active" data-lid="nolid" onclick="selectLid(this)">
                                        <i class="fas fa-times"></i> <span data-tr="KAPAKSIZ" data-en="NO LID">Kapaksız</span>
                                    </button>
                                    <button class="lid-btn" data-lid="lid" onclick="selectLid(this)">
                                        <i class="fas fa-coffee"></i> <span data-tr="KAPAKLI" data-en="WITH LID">Kapaklı</span>
                                    </button>
                                </div>
                            </div>

                            <div id="stock-info-${c.id}" style="font-weight:700; font-size:14px; margin-bottom:20px;"></div>

                            <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">
                                <div style="display:flex; flex-direction:column; gap:8px;">
                                    <label style="font-size:12px; font-weight:800; color:var(--theme-text); display:flex; align-items:center; gap:5px;">
                                        <i class="fas fa-pencil-alt"></i> <span data-tr="ÖZEL İSTEK NOTUNUZ" data-en="YOUR SPECIAL REQUEST NOTE">ÖZEL İSTEK NOTUNUZ</span>
                                    </label>
                                    <textarea id="note-${c.id}" placeholder="Üzerine ne yazılmasını istersiniz? Veya diğer özel istekleriniz..." style="width:100%; height:80px; padding:12px; border-radius:12px; border:2px solid var(--theme-color); background:rgba(255,255,255,0.1); color:var(--theme-text); font-family:inherit; font-size:13px; outline:none; resize:none;"></textarea>
                                </div>

                                <div id="price-display-${c.id}" style="font-size:32px; font-weight:900; color:var(--theme-color); margin-bottom:15px;">₺15,00</div>

                                <button onclick="addToCartConcept('${c.id}')" id="add-btn-${c.id}" class="order-btn" style="background:var(--theme-color); color:white; border:none; width:100%; border-radius:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; padding:18px; margin-top:10px;">
                                    <i class="fas fa-crown"></i><span data-tr="PREMIUM SEPETE EKLE" data-en="ADD PREMIUM TO CART">PREMIUM SEPETE EKLE</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                wrapper.appendChild(section);
                // Initial price refresh
                setTimeout(() => updateConceptPrice(c.id), 100);
            });

            renderPagination(totalPages);
            setupObserver();
            // Scroll to top of wrapper when changing page
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            const pag = document.getElementById('pagination');
            if (totalPages <= 1) {
                pag.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>
                `;
            }
            pag.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderConceptSections();
        }

        async function selectLid(btn) {
            const container = btn.parentNode;
            container.querySelectorAll('.lid-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateCupVisual(container.dataset.conceptId);
        }

        function updateCupVisual(conceptId) {
            const concept = concepts.find(c => c.id == conceptId);
            if (!concept) return;

            const section = document.getElementById(conceptId);
            const sizeBtn = section.querySelector('.size-btn.active');
            const lidBtn = section.querySelector('.lid-btn.active');
            
            const oz = sizeBtn.dataset.oz;
            const lid = lidBtn.dataset.lid;
            const scale = sizeBtn.dataset.scale || 1.0;
            const variantKey = `${oz}-${lid}`;
            
            const variantData = (concept.variations && concept.variations[variantKey]) 
                               ? concept.variations[variantKey] 
                               : { img: concept.base_image, stock: 100 };
            
            const targetSrc = variantData.img || concept.base_image;
            const stock = variantData.stock !== undefined ? variantData.stock : 100;

            const cupImg = section.querySelector('.dynamic-cup');
            const preview = section.querySelector('.cup-preview');
            
            // Remove old OOS overlay if exists
            const oldLayer = preview.querySelector('.oos-layer');
            if(oldLayer) oldLayer.remove();

            if (stock <= 0) {
                cupImg.style.filter = "grayscale(1) opacity(0.3)";
                preview.classList.add('oos-active');
                setTimeout(() => preview.classList.remove('oos-active'), 600);
                
                const layer = document.createElement('div');
                layer.className = 'oos-layer';
                layer.style.cssText = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-15deg); background:#ef4444; color:white; padding:12px 25px; font-weight:900; border-radius:15px; z-index:50; box-shadow:0 15px 30px rgba(239, 68, 68, 0.4); font-size:16px; border:3px solid white; pointer-events:none;";
                layer.innerHTML = "STOKTA YOK";
                preview.appendChild(layer);
            } else {
                cupImg.style.filter = "none";
                preview.classList.remove('oos-active');
            }

            cupImg.style.transform = `scale(${scale})`;
            cupImg.src = targetSrc;

            // Update Price display if exists or create it
            let priceEl = section.querySelector('.concept-price');
            if(!priceEl) {
                priceEl = document.createElement('div');
                priceEl.className = 'concept-price';
                priceEl.style.cssText = "font-size:36px; font-weight:900; color:var(--theme-color); margin-bottom:20px; letter-spacing:-1px;";
                section.querySelector('.concept-details p').after(priceEl);
            }
            const price = variantData.price || concept.price || 15.0;
            priceEl.innerHTML = `₺${parseFloat(price).toLocaleString('tr-TR', {minimumFractionDigits:2})}`;

            // Update WA
            const waBtn = section.querySelector('.order-btn:not([onclick*="addToCart"])'); // Find WA btn if any
            if (waBtn) {
                const name = concept.name;
                if(stock <= 0) {
                    waBtn.style.opacity = "0.5";
                    waBtn.style.pointerEvents = "none";
                    waBtn.innerHTML = `<i class="fas fa-clock"></i> <span data-tr="STOK BEKLENİYOR" data-en="AWAITING STOCK">STOK BEKLENİYOR</span>`;
                } else {
                    waBtn.style.opacity = "1";
                    waBtn.style.pointerEvents = "auto";
                    waBtn.innerHTML = `<i class="fab fa-whatsapp"></i> <span data-tr="TEKLİF AL / SİPARİŞ VER" data-en="GET QUOTE / ORDER">TEKLİF AL / SİPARİŞ VER</span>`;
                    waBtn.href = `https://wa.me/905304640120?text=Merhaba, ${name} konsepti (${oz}, ${lid === 'lid' ? 'Kapaklı' : 'Kapaksız'}) hakkında bilgi almak istiyorum.`;
                }
            }
        }

        function updateThemeColors(section) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const themeColor = section.dataset.color;
            const themeBg = isDark ? '#0a0f1e' : section.dataset.bg;
            const themeText = isDark ? '#f1f5f9' : section.dataset.text;

            root.style.setProperty('--theme-color', themeColor);
            root.style.setProperty('--theme-bg', themeBg);
            root.style.setProperty('--theme-text', themeText);
        }

        function selectSize(btn) {
            const list = btn.parentElement;
            list.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const conceptId = list.dataset.conceptId;
            updateConceptPrice(conceptId);

            const oz = btn.dataset.oz;
            const scaleMap = { '4oz': 0.8, '7oz': 1.0, '8oz': 1.1, '12oz': 1.25 };
            const img = document.querySelector(`#${conceptId} .dynamic-cup`);
            if(img) img.style.transform = `scale(${scaleMap[oz] || 1})`;
        }

        function selectLid(btn) {
            const list = btn.parentElement;
            list.querySelectorAll('.lid-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const conceptId = list.dataset.conceptId;
            updateConceptPrice(conceptId);
        }

        function updateConceptPrice(conceptId) {
            const concept = concepts.find(c => c.id == conceptId);
            if(!concept) return;

            const section = document.getElementById(conceptId);
            const size = section.querySelector('.size-btn.active').dataset.oz;
            const lid = section.querySelector('.lid-btn.active').dataset.lid;
            const variantKey = `${size}-${lid}`;
            const variant = (concept.variations && concept.variations[variantKey]) || {};
            
            const price = variant.price || 15.0;
            const stock = variant.stock === undefined ? 999 : variant.stock;

            const priceEl = document.getElementById(`price-display-${conceptId}`);
            if(priceEl) priceEl.innerText = `₺${parseFloat(price).toLocaleString('tr-TR', {minimumFractionDigits:2})}`;

            const addBtn = document.getElementById(`add-btn-${conceptId}`);
            if(addBtn) {
                if(stock <= 0) {
                    addBtn.disabled = true;
                    addBtn.style.opacity = "0.5";
                    addBtn.innerHTML = `<i class="fas fa-times-circle"></i> STOKTA YOK`;
                } else {
                    addBtn.disabled = false;
                    addBtn.style.opacity = "1";
                    addBtn.innerHTML = `<i class="fas fa-crown"></i> ${localStorage.getItem('lang') === 'en' ? 'ADD PREMIUM TO CART' : 'PREMIUM SEPETE EKLE'}`;
                }
            }
        }

        function addToCartConcept(conceptId) {
            const concept = concepts.find(c => c.id == conceptId);
            if(!concept) return;

            const section = document.getElementById(conceptId);
            const sizeBtn = section.querySelector('.size-btn.active');
            const oz = sizeBtn.dataset.oz;
            const lidBtn = section.querySelector('.lid-btn.active');
            const lid = lidBtn ? lidBtn.dataset.lid : 'nolid';
            const noteArea = document.getElementById(`note-${conceptId}`);
            const note = noteArea ? noteArea.value : "";
            
            const variantKey = `${oz}-${lid}`;
            const variantData = (concept.variations && concept.variations[variantKey]) ? concept.variations[variantKey] : null;
            const price = variantData ? (parseFloat(variantData.price) || 15.0) : 15.0;

            // Show Confirmation Modal
            const modal = document.getElementById('confirm-modal');
            const currentLang = localStorage.getItem('lang') || 'tr';
            
            document.getElementById('conf-name').innerText = concept.name;
            document.getElementById('conf-size').innerText = oz.replace('oz', ' oz');
            document.getElementById('conf-lid').innerText = lid === 'lid' ? (currentLang === 'tr' ? 'Kapaklı' : 'With Lid') : (currentLang === 'tr' ? 'Kapaksız' : 'No Lid');
            document.getElementById('conf-note').innerText = note || (currentLang === 'tr' ? 'Not eklenmedi.' : 'No note added.');
            document.getElementById('conf-price').innerText = `₺${parseFloat(price).toLocaleString('tr-TR', {minimumFractionDigits:2})}`;
            
            modal.style.display = 'flex';

            document.getElementById('conf-cancel').onclick = () => { modal.style.display = 'none'; };
            document.getElementById('conf-approve').onclick = () => {
                const itemId = `concept-${concept.id}-${oz}-${lid}-${Date.now()}`;
                
                cart.push({
                    id: itemId,
                    name: `${concept.name} (${oz}${lid==='lid' ? ' + Kapak':''})`,
                    image: (variantData && variantData.img) ? variantData.img : concept.base_image,
                    price: parseFloat(price),
                    quantity: 1,
                    note: note,
                    isConcept: true
                });
                
                modal.style.display = 'none';
                updateCartDisplay();
                
                // Premium Toast
                const toast = document.createElement('div');
                toast.style.cssText = "position:fixed; top:20px; right:20px; background:linear-gradient(45deg,#d4af37,#f7ef8a); color:#2c2c2c; padding:15px 30px; border-radius:15px; z-index:10000; font-weight:800; border:2px solid white; box-shadow:0 10px 30px rgba(0,0,0,0.2); animation:modalPop 0.5s ease-out;";
                toast.innerHTML = `<i class="fas fa-crown"></i> PREMIUM CONCEPT SEPETE EKLENDİ!`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);

                // Open global cart
                if(typeof toggleCart === 'function') toggleCart(true);
            };
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        updateThemeColors(entry.target);
                        document.querySelectorAll('.dot').forEach(dot => 
                            dot.classList.toggle('active', dot.dataset.target === entry.target.id)
                        );
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.concept-section').forEach(s => observer.observe(s));

            // Search Bar Logic
            const sb = document.getElementById('search-bar');
            const openSearch = document.getElementById('open-search');
            const closeSearch = document.getElementById('close-search');
            const searchInput = document.getElementById('search-input');

            if(openSearch) openSearch.onclick = () => {
                sb.classList.add('active');
                setTimeout(() => searchInput.focus(), 100);
            };
            if(closeSearch) closeSearch.onclick = () => sb.classList.remove('active');

            // Navbar Active Tab
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                 if(link.getAttribute('href') === currentPath) link.classList.add('active');
            });
        }

        // Initialize Call
        document.addEventListener('DOMContentLoaded', () => {
            initConcepts();
            setupObserver();
            updateCartDisplay();

            // Profile Modal Logic
            const pm = document.getElementById('profile-modal');
            const opm = document.getElementById('open-profile-modal');
            const cl = document.querySelector('.profile-close');
            const profileForm = document.getElementById('profile-form');
            
            if(opm) opm.onclick = (e) => { e.preventDefault(); pm.style.display = 'block'; };
            if(cl) cl.onclick = () => { pm.style.display = 'none'; };
            window.onclick = (e) => { if(e.target === pm) pm.style.display = 'none'; };

            // Load saved profile
            const savedData = JSON.parse(localStorage.getItem('moderra_user_data') || '{}');
            if(savedData.name) document.getElementById('user-name').value = savedData.name;
            if(savedData.phone) document.getElementById('user-phone').value = savedData.phone;
            if(savedData.address) document.getElementById('user-address').value = savedData.address;

            if(profileForm) {
                profileForm.onsubmit = (e) => {
                    e.preventDefault();
                    const data = {
                        name: document.getElementById('user-name').value,
                        phone: document.getElementById('user-phone').value,
                        address: document.getElementById('user-address').value
                    };
                    localStorage.setItem('moderra_user_data', JSON.stringify(data));
                    alert(currentLang === 'tr' ? 'Profil güncellendi!' : 'Profile updated!');
                    pm.style.display = 'none';
                };
            }

            // Theme Toggle Logic
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.onclick = () => {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    if (isDark) {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('theme', 'light');
                        themeToggle.classList.replace('fa-sun', 'fa-moon');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                        themeToggle.classList.replace('fa-moon', 'fa-sun');
                    }
                    const activeSection = Array.from(document.querySelectorAll('.concept-section')).find(s => {
                        const rect = s.getBoundingClientRect();
                        return rect.top >= -window.innerHeight/2 && rect.top <= window.innerHeight/2;
                    });
                    if (activeSection) updateThemeColors(activeSection);
                };
            }

            // Language Switch
            const langToggle = document.getElementById('lang-toggle');
            if (langToggle) {
                langToggle.onclick = (e) => { 
                    e.preventDefault(); 
                    currentLang = (currentLang === 'tr' ? 'en' : 'tr'); 
                    localStorage.setItem('lang', currentLang); 
                    updateLanguage(); 
                    renderConceptSections();
                };
            }

            // Navbar Active Tab
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if(link.getAttribute('href') === currentPath) link.classList.add('active');
            });
            
            // Search UI
            const searchIcon = document.getElementById('open-search');
            const searchContainer = document.querySelector('.search-container');
            const closeSearch = document.getElementById('close-search');
            const searchInput = document.getElementById('search-input');

            if(searchIcon) searchIcon.onclick = () => {
                searchContainer.classList.add('active');
                setTimeout(() => searchInput.focus(), 100);
            };
            if(closeSearch) closeSearch.onclick = () => searchContainer.classList.remove('active');
        });

        function updateLanguage() {
            const currentLang = localStorage.getItem('lang') || 'tr';
            document.querySelectorAll('[data-tr]').forEach(el => el.textContent = el.getAttribute('data-' + currentLang));
            const langToggle = document.getElementById('lang-toggle');
            if(langToggle) langToggle.textContent = currentLang === 'tr' ? 'EN' : 'TR';
        }

        (function applyStoredTheme() {
            const saved = localStorage.getItem('theme');
            const themeToggle = document.getElementById('theme-toggle');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (themeToggle) themeToggle.classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (themeToggle) themeToggle.classList.replace('fa-sun', 'fa-moon');
            }
        })();
    </script>
    <script src="global-cart.js"></script>
    <script src="chatbot.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
