<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-tr="Konsept Bardaklar | Moderra" data-en="Concept Cups | Moderra">Konsept Bardaklar | Moderra</title>
    <!-- Performance: DNS prefetch & preconnect -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://api.groq.com" crossorigin>
    <!-- CLS fix: Font Awesome'u asenkron yükle -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body data-scroll-container>
    <!-- Navbar -->
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo"><i class="fas fa-cube"></i> Moderra</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html" data-tr="Ana Sayfa" data-en="Home">Ana Sayfa</a></li>
                <li><a href="konsept-bardaklar.html" data-tr="Konsept Bardaklar" data-en="Concept Cups">Konsept Bardaklar</a></li>
                <li><a href="takip.html" data-tr="Sipariş Takibi" data-en="Order Tracking">Sipariş Takibi</a></li>
                <li><a href="sss.html" data-tr="S.S.S." data-en="F.A.Q.">S.S.S.</a></li>
                <li><a href="about.html" data-tr="Hakkımızda" data-en="About Us">Hakkımızda</a></li>
                <li class="lang-switch"><a href="#" id="lang-toggle">EN</a></li>
            </ul>
            <div class="nav-icons">
                <i class="fas fa-search" id="open-search"></i>
                <i class="fas fa-moon" id="theme-toggle"></i>
                <i class="fas fa-shopping-cart" id="open-cart-modal">
                    <span id="cart-count" style="display:none;">0</span>
                </i>
                <i class="fas fa-user-circle" id="open-profile-modal"></i>
                <button type="button" class="hamburger" id="hamburger-btn" aria-label="Menüyü aç" aria-expanded="false" aria-controls="nav-links">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Arama Overlay -->
    <div class="search-container" id="search-overlay">
        <div class="search-wrapper">
            <i class="fas fa-search" style="position:absolute;left:55px;top:50%;transform:translateY(-50%);font-size:22px;color:#94a3b8;pointer-events:none;"></i>
            <input type="text" id="search-input" placeholder="Konsept ara...">
            <span class="search-close" id="close-search">&times;</span>
        </div>
    </div>

    <div class="category-nav" id="category-nav">
        <!-- Kategoriler JS ile gelecek -->
    </div>

    <div id="concepts-wrapper">
        <!-- Ürünler (Paginated) JS ile gelecek -->
    </div>

    <div class="pagination-container" id="pagination">
        <!-- Sayfa numaraları JS ile gelecek -->
    </div>

    <!-- Modern Profil Modalı -->
    <div id="profile-modal" class="modal">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header-banner">
                <span class="close-btn profile-close" style="color: white;">&times;</span>
                <i class="fas fa-user-circle" style="font-size: 64px; margin-bottom: 15px;"></i>
                <h2 data-tr="Profilim" data-en="My Profile">Profilim</h2>
                <p style="font-size: 14px; opacity: 0.8;" data-tr="Bilgilerinizi buradan yönetebilirsiniz." data-en="You can manage your information here.">Bilgilerinizi buradan yönetebilirsiniz.</p>
            </div>
            <div class="modal-body-padding" style="padding:40px;">
                <form id="profile-form">
                    <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                        <div class="profile-field-item">
                            <label style="display:block; margin-bottom:5px; font-size:11px; font-weight:800; color:var(--primary);"><i class="fas fa-id-card"></i> <span data-tr="Ad Soyad" data-en="Full Name">Ad Soyad</span></label>
                            <input type="text" id="user-name" placeholder="Örn: Doğan Aydın" required style="width:100%; padding:10px; border:1px solid #eee; border-radius:8px;">
                        </div>
                        <div class="profile-field-item">
                            <label style="display:block; margin-bottom:5px; font-size:11px; font-weight:800; color:var(--primary);"><i class="fas fa-phone-alt"></i> <span data-tr="Telefon" data-en="Phone">Telefon</span></label>
                            <input type="tel" id="user-phone" placeholder="05XX XXX XX XX" required style="width:100%; padding:10px; border:1px solid #eee; border-radius:8px;">
                        </div>
                        <div class="profile-field-item">
                            <label style="display:block; margin-bottom:5px; font-size:11px; font-weight:800; color:var(--primary);"><i class="fas fa-map-marker-alt"></i> <span data-tr="Teslimat Adresi" data-en="Shipping Address">Teslimat Adresi</span></label>
                            <textarea id="user-address" rows="3" placeholder="Siparişleriniz için açık adres giriniz..." required style="width:100%; padding:10px; border:1px solid #eee; border-radius:8px;"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 18px; border-radius:12px; background:var(--primary); color:white; font-weight:800;">
                        <i class="fas fa-save"></i> <span data-tr="GÜNCELLE" data-en="UPDATE">GÜNCELLE</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="scroll-indicator" style="display: none;">
        <div class="dot active" data-target="yilbasi"></div>
        <div class="dot" data-target="dugun"></div>
        <div class="dot" data-target="dogumgunu"></div>
        <div class="dot" data-target="ozeltasarim"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal">
        <div class="confirm-content">
            <div class="confirm-header">
                <i class="fas fa-crown" style="font-size: 40px; margin-bottom: 10px;"></i>
                <h2 data-tr="Sipariş Özeti" data-en="Order Summary">Sipariş Özeti</h2>
            </div>
            <div class="confirm-body">
                <div class="confirm-item">
                    <span class="confirm-label" data-tr="Konsept" data-en="Concept">Konsept</span>
                    <span class="confirm-value" id="conf-name">Yılbaşı</span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label" data-tr="Boyut" data-en="Size">Boyut</span>
                    <span class="confirm-value" id="conf-size">4 oz</span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label" data-tr="Kapak" data-en="Lid">Kapak</span>
                    <span class="confirm-value" id="conf-lid">Kapaklı</span>
                </div>
                <div class="confirm-item" style="flex-direction:column; align-items:flex-start; gap:10px;">
                    <span class="confirm-label" data-tr="Özel Notunuz" data-en="Special Note">Özel Notunuz</span>
                    <div id="conf-note" style="font-size:13px; color:#64748b; background:#f8fafc; padding:12px; border-radius:12px; width:100%; font-style:italic;">Note here...</div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:30px; padding-top:20px; border-top:2px solid #f8fafc;">
                    <span style="font-weight:900; color:#1e293b;" data-tr="Toplam Tutar" data-en="Total Amount">Toplam Tutar</span>
                    <span id="conf-price" style="font-size:28px; font-weight:900; color:var(--theme-color);">₺0,00</span>
                </div>
            </div>
            <div class="confirm-footer">
                <button class="confirm-btn confirm-cancel" id="conf-cancel" data-tr="İPTAL" data-en="CANCEL">İPTAL</button>
                <button class="confirm-btn confirm-approve" id="conf-approve" data-tr="ONAYLIYORUM" data-en="APPROVE">ONAYLIYORUM</button>
            </div>
        </div>
    </div>
    

    <!-- cart-system.js ÖNCE yüklenmeli: aksi halde kendi addToCartConcept(item) fonksiyonu
         aşağıdaki addToCartConcept(conceptId)'i ezer, name=null ve price=NaN hatası oluşur -->
    <script type="module" src="js/cart/index.js"></script>

    <script src="js/pages/concepts.js" defer></script>
    <script src="chatbot.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
        <script src="js/site/nav-active.js" defer></script>
    <script src="js/mobile.js" defer></script>

<!-- Sepet (tum sayfalarda ortak) -->
    <div id="cart-modal" class="cart-drawer">
        <div class="cart-header">
            <h2 class="cart-header-title">
                <i class="fas fa-shopping-basket" aria-hidden="true"></i> Sepetim
            </h2>
            <button type="button" class="cart-close-btn" id="cart-close-btn" aria-label="Sepeti kapat">&times;</button>
        </div>
        <div id="cart-progress-sticky"></div>
        <div id="cart-items-list"></div>
        <div class="cart-drawer-footer">
            <div id="cart-total-price-area"></div>
        </div>
    </div>
    <div class="cart-overlay" id="cart-overlay" aria-hidden="true"></div>

    <script type="module" src="js/cart/index.js"></script>
    <script src="js/site/nav-active.js" defer></script>
    <script src="js/mobile.js" defer></script>
</body>
</html>
