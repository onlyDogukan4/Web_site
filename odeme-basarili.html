<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ödeme Başarılı — Moderra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; color: #fff;
            overflow-x: hidden; padding: 20px;
        }

        /* Arkaplan partiküller */
        .bg-particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.4), transparent);
            animation: float-particle linear infinite;
        }
        @keyframes float-particle {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        .card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 520px; width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.2);
            animation: card-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes card-in {
            from { opacity: 0; transform: scale(0.85) translateY(40px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Onay ikonu */
        .check-ring {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            box-shadow: 0 0 0 0 rgba(16,185,129,0.4);
            animation: pulse-green 2s ease-in-out infinite;
        }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
            50%     { box-shadow: 0 0 0 20px rgba(16,185,129,0); }
        }
        .check-ring i { font-size: 44px; color: white; }

        h1 { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 32px; }

        /* Sipariş Kodu Kutusu */
        .order-box {
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 16px; padding: 20px 24px;
            margin-bottom: 28px;
        }
        .order-box label {
            font-size: 11px; font-weight: 800; letter-spacing: 2px;
            color: rgba(255,255,255,0.5); text-transform: uppercase; display: block;
            margin-bottom: 8px;
        }
        .order-code {
            font-size: 32px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(90deg, #a5b4fc, #818cf8, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .order-hint {
            font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 8px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        /* Detay satırları */
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px; margin-bottom: 8px;
            font-size: 14px;
        }
        .detail-row .lbl { color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 8px; }
        .detail-row .val { font-weight: 700; }
        .detail-row .val.green { color: #34d399; }
        .detail-row .val.purple { color: #a5b4fc; }

        /* Adımlar */
        .steps {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 12px; margin: 24px 0;
        }
        .step {
            background: rgba(255,255,255,0.04); border-radius: 12px;
            padding: 14px 8px; text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .step i { font-size: 20px; color: #a5b4fc; margin-bottom: 6px; display: block; }
        .step span { font-size: 11px; color: rgba(255,255,255,0.55); }

        .btn-home {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; text-decoration: none;
            padding: 14px 32px; border-radius: 14px;
            font-weight: 800; font-size: 15px; margin-top: 8px;
            transition: all 0.3s; border: none; cursor: pointer; width: 100%;
            justify-content: center;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.4); }

        .copy-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 8px;
            font-size: 12px; cursor: pointer; margin-top: 10px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.15); color: white; }

        .logo-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: rgba(255,255,255,0.3); text-decoration: none;
            font-size: 13px; font-weight: 700; margin-bottom: 28px;
        }
        .logo-link:hover { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>

<!-- Partiküller -->
<div class="bg-particles" id="particles"></div>

<div class="card">
    <a href="index.html" class="logo-link">
        <i class="fas fa-cube"></i> Moderra
    </a>

    <div class="check-ring">
        <i class="fas fa-check"></i>
    </div>

    <h1>Ödeme Başarılı!</h1>
    <p class="subtitle">Siparişiniz alındı, hazırlık sürecine geçildi.</p>

    <!-- Sipariş Kodu -->
    <div class="order-box">
        <label><i class="fas fa-hashtag"></i> Sipariş Takip Kodunuz</label>
        <div class="order-code" id="order-code">—</div>
        <div class="order-hint">
            <i class="fas fa-info-circle"></i>
            Kargo takibinde bu kodu kullanın
        </div>
        <button class="copy-btn" onclick="copyCode()">
            <i class="fas fa-copy"></i> Kodu Kopyala
        </button>
    </div>

    <!-- Detaylar -->
    <div id="order-details"></div>

    <!-- Sonraki Adımlar -->
    <div class="steps">
        <div class="step">
            <i class="fas fa-box"></i>
            <span>Sipariş Hazırlanıyor</span>
        </div>
        <div class="step">
            <i class="fas fa-truck"></i>
            <span>Kargoya Verilecek</span>
        </div>
        <div class="step">
            <i class="fas fa-home"></i>
            <span>Kapınıza Teslim</span>
        </div>
    </div>

    <a href="index.html" class="btn-home">
        <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
    </a>
</div>

<script>
    // İFrame içindeyse üst sayfayı bu URL'e yönlendir
    if (window !== window.top) {
        window.top.location.href = window.location.href;
    }

    // URL parametrelerinden sipariş bilgisini al
    const params = new URLSearchParams(window.location.search);
    const orderId    = params.get('merchant_oid') || params.get('orderId') || localStorage.getItem('last_order_id') || '—';
    const totalAmt   = params.get('total_amount') || '';

    // Kod göster
    document.getElementById('order-code').textContent = orderId;
    document.title = `Sipariş ${orderId} — Moderra`;

    // Sipariş detaylarını API'den çek
    async function loadOrderDetails() {
        if (orderId === '—') return;
        try {
            const res = await fetch(`/api/orders?t=${Date.now()}`);
            const orders = await res.json();
            const order = Array.isArray(orders) ? orders.find(o => o.orderId === orderId) : null;
            if (!order) return;

            const container = document.getElementById('order-details');
            const total = order.totalPrice || (totalAmt ? (parseInt(totalAmt)/100).toFixed(2) : '—');
            container.innerHTML = `
                <div class="detail-row">
                    <span class="lbl"><i class="fas fa-user"></i> Müşteri</span>
                    <span class="val">${order.customerName || '—'}</span>
                </div>
                <div class="detail-row">
                    <span class="lbl"><i class="fas fa-shopping-bag"></i> Ürünler</span>
                    <span class="val purple" style="font-size:12px;max-width:55%;text-align:right;">${order.items || '—'}</span>
                </div>
                <div class="detail-row">
                    <span class="lbl"><i class="fas fa-lira-sign"></i> Toplam</span>
                    <span class="val green">₺${parseFloat(total).toLocaleString('tr-TR', {minimumFractionDigits:2})}</span>
                </div>
                ${order.installments && order.installments > 1 ? `
                <div class="detail-row">
                    <span class="lbl"><i class="fas fa-credit-card"></i> Taksit</span>
                    <span class="val">${order.installments} Taksit</span>
                </div>` : ''}
            `;
        } catch(e) { /* detaylar yüklenemedi */ }
    }

    loadOrderDetails();

    function copyCode() {
        if (orderId === '—') return;
        navigator.clipboard.writeText(orderId).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
            btn.style.color = '#34d399';
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-copy"></i> Kodu Kopyala';
                btn.style.color = '';
            }, 2000);
        });
    }

    // Partiküller
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 80 + 30;
        p.style.cssText = `
            width:${size}px; height:${size}px;
            left:${Math.random()*100}%;
            animation-duration:${Math.random()*10+8}s;
            animation-delay:-${Math.random()*12}s;
        `;
        container.appendChild(p);
    }

    // Sepeti temizle
    try { localStorage.removeItem('cart'); } catch(e) {}
</script>
    <script src="js/mobile.js" defer></script>
</body>
</html>
